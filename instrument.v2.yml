name: codeframe
id: codeframe
version: 0.6.3

actions:
  verify:
    with:
      requirements:
        - name: Java 17+
          min: 17.0.0
          command: java -version
          match:
            - 'version "(?<version>.+)"'
        - name: Python 3.9+
          min: 3.9.0
          command:
            windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 --version) else (python --version)
            unix: if command -v python3 >/dev/null 2>&1; then python3 --version; else python --version; fi
          match:
            - 'Python (?<version>.+)'
  start:
    commands:
      run-codeframe:
        id: run-codeframe
        dir: ${instrumentPath}
        command: >-
          java -jar codeframe.jar "${repo}" "${instrumentPath}/results/${repoName}.jsonl"

  summary:
    md-file: results/summary.md
    html-file: results/summary.html
    category: Structural Relations
    commands:
      generate-summary:
        id: generate-summary
        dir: ${instrumentPath}
        command:
          windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 codeframe-summary.py "${instrumentPath}/results") else (python codeframe-summary.py "${instrumentPath}/results")
          unix: if command -v python3 >/dev/null 2>&1; then python3 codeframe-summary.py "${instrumentPath}/results"; else python codeframe-summary.py "${instrumentPath}/results"; fi

  clean:
    with:
      locations:
        - source: ${instrumentDir}/results

  pack:
    with:
      locations:
        - source: ${instrumentDir}/results
          destination: /results
